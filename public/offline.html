<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
<title>You're offline — Sewiness</title>
<style>
  :root { color-scheme: light; }
  * { box-sizing: border-box; }
  html, body {
    height: 100%;
    margin: 0;
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
    background: #faf8f5;
    color: #1c1917;
  }
  body {
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    text-align: center;
    padding: 24px;
    padding-top: max(24px, env(safe-area-inset-top));
    padding-bottom: max(24px, env(safe-area-inset-bottom));
  }
  .mark {
    width: 56px;
    height: 56px;
    border-radius: 16px;
    background: #2D2D2D;
    display: flex;
    align-items: center;
    justify-content: center;
    margin-bottom: 20px;
  }
  .mark svg { width: 28px; height: 28px; }
  h1 { font-size: 1.25rem; font-weight: 600; margin: 0 0 8px; }
  p { font-size: 0.9rem; color: #78716c; margin: 0 0 20px; max-width: 320px; }
  button {
    appearance: none;
    border: none;
    background: #800020;
    color: #faf8f5;
    font-size: 0.9rem;
    font-weight: 600;
    padding: 10px 20px;
    border-radius: 8px;
    cursor: pointer;
  }
  button:active { background: #6b0018; }
</style>
</head>
<body>
  <div class="mark">
    <svg viewBox="0 0 30 30" xmlns="http://www.w3.org/2000/svg">
      <path fill="#fff" d="M15.47,7.1l-1.3,1.85c-0.2,0.29-0.54,0.47-0.9,0.47h-7.1V7.09C6.16,7.1,15.47,7.1,15.47,7.1z"/>
      <polygon fill="#fff" points="24.3,7.1 13.14,22.91 5.7,22.91 16.86,7.1"/>
      <path fill="#fff" d="M14.53,22.91l1.31-1.86c0.2-0.29,0.54-0.47,0.9-0.47h7.09v2.33H14.53z"/>
    </svg>
  </div>
  <h1>You're offline</h1>
  <p>Sewiness needs a connection to load your orders and studio data. Reconnect and try again.</p>
  <button onclick="location.reload()">Try again</button>
</body>
</html>
