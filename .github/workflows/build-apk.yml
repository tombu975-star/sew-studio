name: Build Android APK

# Wraps the live Sewsiness website in an Android app (Capacitor) and builds an APK.
#
# Run it: GitHub > Actions > "Build Android APK" > Run workflow.
# Setup:  Settings > Secrets and variables > Actions > Variables > New variable
#         APP_URL = https://your-app.up.railway.app   (your site's https address)
# Signed release APK (optional): add the secrets listed in mobile/README.md.
# Tag a commit "v1.0.0" and push the tag to also publish the APK on the Releases page.

on:
  workflow_dispatch:
    inputs:
      app_url:
        description: "Site address (https://…). Leave empty to use the APP_URL variable."
        required: false
        type: string
      build_type:
        description: "debug = installs anywhere for testing; release = signed (needs the keystore secrets)"
        required: true
        default: debug
        type: choice
        options: [debug, release]
  push:
    tags: ["v*"]

permissions:
  contents: write

concurrency:
  group: build-apk-${{ github.ref }}
  cancel-in-progress: true

jobs:
  apk:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    env:
      APP_URL: ${{ inputs.app_url || vars.APP_URL }}
      BUILD_TYPE: ${{ inputs.build_type || (startsWith(github.ref, 'refs/tags/') && 'release' || 'debug') }}
      KEYSTORE_B64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
    defaults:
      run:
        working-directory: mobile
    steps:
      - uses: actions/checkout@v4

      - name: Check the site address
        run: |
          if [ -z "$APP_URL" ]; then
            echo "::error::Set the APP_URL repository variable (Settings > Secrets and variables > Actions > Variables) to your site's https address, or type it in when you run the workflow."
            exit 1
          fi
          case "$APP_URL" in https://*) ;; *) echo "::error::APP_URL must start with https://"; exit 1;; esac
          if [ "$BUILD_TYPE" = "release" ] && [ -z "$KEYSTORE_B64" ]; then
            echo "::error::A release build needs the signing secrets. See mobile/README.md, or choose the debug build."
            exit 1
          fi

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21
          cache: gradle

      - name: Install Capacitor
        run: npm install --no-audit --no-fund

      - name: Create the Android project
        run: |
          npx cap add android
          npx cap sync android

      - name: App icon and version
        run: |
          set -euo pipefail
          sudo apt-get install -y --no-install-recommends imagemagick >/dev/null
          RES=android/app/src/main/res
          sizes="mdpi:48:108 hdpi:72:162 xhdpi:96:216 xxhdpi:144:324 xxxhdpi:192:432"
          for entry in $sizes; do
            d=${entry%%:*}; rest=${entry#*:}; legacy=${rest%%:*}; fg=${rest#*:}
            safe=$(( fg * 2 / 3 ))
            convert ../public/icon-512.png -resize ${legacy}x${legacy} $RES/mipmap-$d/ic_launcher.png
            convert ../public/icon-512.png -resize ${legacy}x${legacy} $RES/mipmap-$d/ic_launcher_round.png
            convert ../public/icon-512.png -resize ${safe}x${safe} -background none -gravity center -extent ${fg}x${fg} $RES/mipmap-$d/ic_launcher_foreground.png
          done
          sed -i "s/versionCode 1/versionCode ${{ github.run_number }}/; s/versionName \"1.0\"/versionName \"1.0.${{ github.run_number }}\"/" android/app/build.gradle

      - name: Build debug APK
        if: env.BUILD_TYPE == 'debug'
        working-directory: mobile/android
        run: ./gradlew --no-daemon assembleDebug

      - name: Build and sign release APK
        if: env.BUILD_TYPE == 'release'
        working-directory: mobile/android
        env:
          KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          set -euo pipefail
          ./gradlew --no-daemon assembleRelease
          BT="$ANDROID_HOME/build-tools/$(ls "$ANDROID_HOME/build-tools" | sort -V | tail -1)"
          echo "$KEYSTORE_B64" | base64 -d > "$RUNNER_TEMP/release.keystore"
          cd app/build/outputs/apk/release
          "$BT/zipalign" -f -p 4 app-release-unsigned.apk app-release-aligned.apk
          "$BT/apksigner" sign --ks "$RUNNER_TEMP/release.keystore" \
            --ks-pass env:KEYSTORE_PASSWORD --ks-key-alias "$KEY_ALIAS" --key-pass env:KEY_PASSWORD \
            --out Sewsiness-release.apk app-release-aligned.apk
          "$BT/apksigner" verify Sewsiness-release.apk
          rm -f "$RUNNER_TEMP/release.keystore"

      - name: Collect the APK
        run: |
          mkdir -p ../dist
          if [ "$BUILD_TYPE" = "release" ]; then
            cp android/app/build/outputs/apk/release/Sewsiness-release.apk ../dist/Sewsiness.apk
          else
            cp android/app/build/outputs/apk/debug/app-debug.apk ../dist/Sewsiness-debug.apk
          fi
          ls -la ../dist

      - uses: actions/upload-artifact@v4
        with:
          name: Sewsiness-apk
          path: dist/*.apk
          if-no-files-found: error
          retention-days: 30

      - name: Attach to the GitHub release
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v3
        with:
          files: dist/*.apk
